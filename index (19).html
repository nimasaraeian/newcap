<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پنل تیم نیوکپ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2D58; --navy-2:#14284A; --ink:#0F1B2D; --body:#4B5768; --muted:#8B95A5;
  --orange:#FF7B02; --line:#E4E9F0; --bg:#F4F6FA; --card:#FFFFFF;
  --green:#12A150; --red:#E5484D; --blue:#2563EB; --amber:#D99100;
  --sh:0 1px 2px rgba(13,30,58,.06),0 8px 24px -12px rgba(13,30,58,.18);
  --sh-lg:0 20px 50px -24px rgba(13,30,58,.4);
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;font-size:14px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cfd6e2;border-radius:8px;border:3px solid var(--bg)}

/* ============ login ============ */
.login{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:radial-gradient(70% 90% at 70% 20%,#17406f 0%,#0B2D58 45%,#071B36 100%)}
.login .box{width:min(400px,92vw);background:var(--card);border-radius:20px;padding:34px 30px;box-shadow:var(--sh-lg)}
.login h1{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.01em}
.login p{margin:0 0 22px;color:var(--muted);font-size:12.5px}
.login label{display:block;font-size:12px;font-weight:600;color:var(--body);margin:14px 0 6px}
.login input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:#FAFBFD;outline:none}
.login input:focus{border-color:var(--navy);background:#fff}
.login .go{margin-top:22px;width:100%;height:46px;border:0;border-radius:11px;background:var(--orange);color:#fff;font-weight:700;cursor:pointer}
.login .go:hover{filter:brightness(1.05)}
.login .err{margin-top:12px;color:var(--red);font-size:12.5px;min-height:18px}
.login .hint{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:2}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brandmark .lg{width:132px;height:auto;display:block}
.brandmark .panel-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  padding:3px 8px;border-radius:20px;background:#EEF2F7;white-space:nowrap}
.side .brandmark{margin-bottom:26px;gap:9px}
.side .brandmark .lg{width:120px;filter:brightness(0) invert(1)}
.side .brandmark .panel-tag{background:rgba(255,255,255,.14);color:#CFE0F5}

/* ============ shell ============ */
.app{display:none;min-height:100%;grid-template-columns:248px 1fr}
.app.on{display:grid}
.side{background:var(--navy);color:#DCE6F3;padding:20px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}

.side nav{display:flex;flex-direction:column;gap:3px}
.side nav button{display:flex;align-items:center;gap:11px;padding:11px 13px;border:0;border-radius:11px;background:transparent;
  color:#C6D6EA;font-size:13.5px;font-weight:600;cursor:pointer;text-align:start;transition:background .18s,color .18s}
.side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav button.on{background:#fff;color:var(--navy)}
.side nav button svg{width:18px;height:18px;flex:none}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.07)}
.side .me .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.side .me b{display:block;font-size:12.5px;color:#fff}
.side .me span{font-size:10.5px;color:#9FB4CE}
.side .out{margin-inline-start:auto;background:transparent;border:0;color:#9FB4CE;cursor:pointer;padding:4px}
.side .out:hover{color:#fff}

.main{padding:26px 30px 60px;min-width:0}
.top{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.015em}
.top .sub{color:var(--muted);font-size:12.5px}
.top .sp{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:border-color .18s,transform .18s}
.btn:hover{border-color:#c9d3e2}
.btn.p{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.p:hover{filter:brightness(1.05)}
.btn.d{background:transparent;border-color:transparent;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.k2{grid-template-columns:repeat(2,1fr)}
.sec-t{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:14.5px;font-weight:700}
.sec-t span{color:var(--muted);font-size:12px;font-weight:500}

/* kpi */
.kpi{padding:18px}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted);margin-inline-start:4px}
.kpi .t{margin-top:8px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px}
.up{color:var(--green);background:rgba(18,161,80,.1)}
.down{color:var(--red);background:rgba(229,72,77,.1)}

/* table */
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid #F1F4F9;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:#FAFBFE}
.who{display:flex;align-items:center;gap:9px}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.who b{font-weight:600;display:block}
.who span{color:var(--muted);font-size:11.5px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%}
.num{font-variant-numeric:tabular-nums;font-weight:600}

/* filters */
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar input,.bar select{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none;font-size:13px}
.bar input{min-width:240px}
.bar input:focus,.bar select:focus{border-color:var(--navy)}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#EDF1F7;border-radius:var(--r);padding:12px;min-height:180px}
.col h4{margin:0 0 10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.col h4 b{margin-inline-start:auto;color:var(--muted);font-weight:600;font-size:11.5px}
.cc{background:var(--card);border-radius:11px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(13,30,58,.07);cursor:grab;border:1px solid transparent}
.cc:hover{border-color:#D5DEEB}
.cc.drag{opacity:.45}
.col.over{outline:2px dashed #B9C7DA;outline-offset:-4px}
.cc b{display:block;font-size:13px}
.cc span{color:var(--muted);font-size:11.5px}
.cc .r{display:flex;align-items:center;gap:6px;margin-top:8px}
.cc .r .num{font-size:12px;margin-inline-start:auto}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--body)}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-inline-end:6px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(9,22,44,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(460px,94vw);background:var(--card);z-index:50;
  display:flex;flex-direction:column;box-shadow:var(--sh-lg);
  transform:translateX(100%);visibility:hidden;opacity:0;pointer-events:none;
  transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .25s ease,visibility 0s .35s}
html[dir="ltr"] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none;visibility:visible;opacity:1;pointer-events:auto;transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .2s ease}
.drawer header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.drawer header h3{margin:0;font-size:16px;font-weight:800}
.drawer header .x{margin-inline-start:auto;background:transparent;border:0;font-size:20px;cursor:pointer;color:var(--muted)}
.drawer .body{padding:20px 22px;overflow:auto;flex:1}
.drawer footer{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--body);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#FAFBFD;outline:none;font-size:13px}
.f textarea{min-height:86px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy);background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:#F7F9FC;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;font-size:12.5px}
.note span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}

/* team */
.tm{display:flex;align-items:center;gap:13px;padding:16px}
.tm .av{width:46px;height:46px;border-radius:13px;font-size:15px}
.tm b{font-size:14px}
.tm span{color:var(--muted);font-size:12px;display:block}
.tm .mini{margin-inline-start:auto;text-align:center}
.tm .mini b{display:block;font-size:14px}
.tm .mini span{font-size:10.5px}

/* chat */
.chat{display:flex;flex-direction:column;height:min(64vh,560px)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:78%}
.msg .bub{background:#F1F4F9;border-radius:14px;padding:10px 13px;font-size:13px}
.msg b{font-size:12px;display:block;margin-bottom:3px}
.msg time{font-size:10.5px;color:var(--muted);display:block;margin-top:4px}
.msg.mine{margin-inline-start:auto;flex-direction:row-reverse}
.msg.mine .bub{background:var(--navy);color:#fff}
.msg.mine time{color:#9FB4CE}
.send{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.send input{flex:1;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:#FAFBFD;outline:none}
.send input:focus{border-color:var(--navy);background:#fff}

.empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px}
.demo{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;background:rgba(255,123,2,.12);color:#B45700;font-size:11.5px;font-weight:700}

@media (max-width:1100px){ .k4{grid-template-columns:repeat(2,1fr)} .k3{grid-template-columns:1fr} }
@media (max-width:860px){
  .app.on{grid-template-columns:1fr}
  .side{position:fixed;inset-inline-start:0;inset-block:0;width:250px;z-index:45;transform:translateX(100%);transition:transform .3s}
  html[dir="rtl"] .side{inset-inline-start:auto;inset-inline-end:0}
  .side.open{transform:none}
  .main{padding:18px 16px 50px}
  .k2,.k4{grid-template-columns:1fr}
  .burger{display:inline-flex!important}
}
.burger{display:none}
</style>
</head>

    { id:uid(), customer:won[1].id, owner:'nima',      amount:780e6, at: now - 26*day, rate:3, paid:true },
    { id:uid(), customer:won[0].id, owner:'ramezani', amount:640e6, at: now - 58*day, rate:3, paid:false },
    { id:uid(), customer:won[1].id, owner:'sara',      amount:310e6, at: now - 74*day, rate:2, paid:false }
  ];
  const messages = [
    { id:uid(), by:'hadi', at: now - 5*3600e3, text:'سلام تیم. گزارش فروش این هفته رو تا پنجشنبه در پنل ثبت کنید.' },
    { id:uid(), by:'nima', at: now - 4*3600e3, text:'نمونهٔ درپوش قفل کودک برای شیمی گستر ارسال شد. منتظر تست هستیم.' },

let ME = null;
try { const u = localStorage.getItem(KEY + '_me'); if (u) ME = member(u); } catch(e){}

$('#go').addEventListener('click', tryLogin);
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
function tryLogin(){
  const u = $('#u').value.trim().toLowerCase(), p = $('#pw').value;
  const hit = TEAM.find(t => t.user === u);
  if (!hit || p !== 'newcap') { $('#err').textContent = 'نام کاربری یا رمز درست نیست.'; return; }
  ME = hit; try { localStorage.setItem(KEY + '_me', hit.id); } catch(e){}

}
function logout(){ ME = null; try { localStorage.removeItem(KEY + '_me'); } catch(e){} location.reload(); }

/* ------------------------------- shell ------------------------------ */

  crm:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7.5" cy="6.5" r="3"/><path d="M2 16.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M14 7.5h4M16 5.5v4" stroke-linecap="round"/></svg>',
  sales:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 15.5 7.5 10l3.5 3 5-7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 6h3.5v3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  team:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7" cy="7" r="2.6"/><circle cx="14" cy="8" r="2.2"/><path d="M2.5 16c0-2.6 2-4.4 4.5-4.4s4.5 1.8 4.5 4.4M13 11.7c2.2 0 4 1.6 4 4"/></svg>',
  chat:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M17 10.5c0 3.3-3.1 6-7 6-.9 0-1.8-.15-2.6-.4L3 17.5l1.3-3.2C3.5 13.3 3 12 3 10.5c0-3.3 3.1-6 7-6s7 2.7 7 6Z" stroke-linejoin="round"/></svg>'
};
const PAGES = [
  { id:'dash',  name:'داشبورد',        icon:'dash'  },
  { id:'crm',   name:'مشتریان (CRM)',  icon:'crm'   },
  { id:'sales', name:'فروش و پورسانت', icon:'sales' },
  { id:'team',  name:'تیم',            icon:'team'  },
  { id:'chat',  name:'گفتگوی تیمی',    icon:'chat'  }
];
let page = 'crm';

function start(){
  $('#login').style.display = 'none';
  $('#app').classList.add('on');
  $('#nav').innerHTML = PAGES.map(p => `<button data-p="${p.id}">${ICONS[p.icon]}<span>${p.name}</span></button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { page = b.dataset.p; render(); $('#side').classList.remove('open'); }));
  $('#me').innerHTML = `<span class="av" style="background:${ME.colour}">${ME.name.slice(0,1)}</span>
    <div><b>${ME.name}</b><span>${ME.role}</span></div>
    <button class="out" title="خروج">⏻</button>`;
  $('#me').querySelector('.out').addEventListener('click', logout);
  render();
}

function render(){
  closeDrawer();
  $('#nav').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.p === page));
  const v = $('#view');
  v.innerHTML = ({ dash:viewDash, crm:viewCRM, sales:viewSales, team:viewTeam, chat:viewChat })[page]();
  ({ crm:wireCRM, sales:wireSales, chat:wireChat, dash:()=>{}, team:()=>{} })[page]();
}

function head(title, sub, actions = ''){
  return `<div class="top">
    <button class="btn burger" id="burger">☰</button>
    <div><h2>${title}</h2><div class="sub">${sub}</div></div>
    <div class="sp">${actions}</div></div>`;
}
document.addEventListener('click', e => {
  if (e.target.id === 'burger') $('#side').classList.toggle('open');
});

/* ------------------------------ helpers ----------------------------- */
const avatar = id => { const m = member(id); return `<span class="av" style="background:${m.colour}">${m.name.slice(0,1)}</span>`; };
const stageTag = id => { const s = stage(id); return `<span class="tag" style="background:${s.colour}1a;color:${s.colour}"><i class="dot" style="background:${s.colour}"></i>${s.name}</span>`; };
const money = n => `<span class="num">${RIAL(n/1e6)}</span> <small style="color:var(--muted);font-size:11px">م.ت</small>`;

/* =============================== CRM ================================ */
let crmQ = '', crmOwner = 'all', crmStage = 'all', crmView = 'kanban';

function crmList(){
  return DB.customers.filter(c =>
    (crmOwner === 'all' || c.owner === crmOwner) &&
    (crmStage === 'all' || c.stage === crmStage) &&
    (!crmQ || (c.name + c.city + c.need + c.phone).toLowerCase().includes(crmQ.toLowerCase())));
}

function viewCRM(){
  const list = crmList();
  const body = crmView === 'kanban' ? kanban(list) : table(list);
  return head('مشتریان', `${FA(DB.customers.length)} مشتری ثبت شده · ${FA(list.length)} در نمای فعلی`,
    `<button class="btn" id="toggleView">${crmView === 'kanban' ? 'نمای جدولی' : 'نمای مرحله‌ای'}</button>
     <button class="btn p" id="addC">+ مشتری جدید</button>`) +
    `<div class="bar">
      <input id="q" placeholder="جستجوی نام، شهر، نیاز یا شماره…" value="${crmQ}">
      <select id="fOwner"><option value="all">همهٔ مسئول‌ها</option>${TEAM.map(t => `<option value="${t.id}" ${crmOwner===t.id?'selected':''}>${t.name}</option>`).join('')}</select>
      <select id="fStage"><option value="all">همهٔ مراحل</option>${STAGES.map(s => `<option value="${s.id}" ${crmStage===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
    </div>` + body;
}

function kanban(list){
  return `<div class="kan">${STAGES.map(s => {
    const items = list.filter(c => c.stage === s.id);
    const sum = items.reduce((a,c) => a + c.value, 0);
    return `<div class="col" data-stage="${s.id}">
      <h4><i class="dot" style="background:${s.colour}"></i>${s.name}<b>${FA(items.length)} · ${RIAL(sum/1e6)}</b></h4>
      ${items.map(c => `<div class="cc" draggable="true" data-id="${c.id}">
        <b>${c.name}</b><span>${c.city} · ${c.industry}</span>
        <div class="r">${avatar(c.owner)}<span>${member(c.owner).name}</span><span class="num">${RIAL(c.value/1e6)}</span></div>
      </div>`).join('') || '<div style="color:var(--muted);font-size:12px;padding:6px 2px">موردی نیست</div>'}
    </div>`;
  }).join('')}</div>`;
}

function table(list){
  return `<div class="card"><table>
    <thead><tr><th>مشتری</th><th>صنعت</th><th>مرحله</th><th>مسئول</th><th>ارزش تخمینی</th><th>آخرین به‌روزرسانی</th></tr></thead>
    <tbody>${list.map(c => `<tr data-id="${c.id}">
      <td><div class="who">${avatar(c.owner)}<div><b>${c.name}</b><span>${c.city} · ${c.phone}</span></div></div></td>
      <td>${c.industry}</td><td>${stageTag(c.stage)}</td><td>${member(c.owner).name}</td>
      <td>${money(c.value)}</td><td style="color:var(--muted)">${DATE(c.notes.length ? c.notes[c.notes.length-1].at : c.created)}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="empty">مشتری‌ای با این فیلترها نیست</td></tr>'}</tbody>
  </table></div>`;
}

function wireCRM(){
  $('#q').addEventListener('input', e => { crmQ = e.target.value; const s = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(s,s); });
  $('#fOwner').addEventListener('change', e => { crmOwner = e.target.value; render(); });
  $('#fStage').addEventListener('change', e => { crmStage = e.target.value; render(); });
  $('#toggleView').addEventListener('click', () => { crmView = crmView === 'kanban' ? 'table' : 'kanban'; render(); });
  $('#addC').addEventListener('click', () => editCustomer(null));
  document.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.addEventListener('click', () => openCustomer(tr.dataset.id)));
  document.querySelectorAll('.cc').forEach(cc => {
    cc.addEventListener('click', () => openCustomer(cc.dataset.id));
    cc.addEventListener('dragstart', e => { e.dataTransfer.setData('id', cc.dataset.id); cc.classList.add('drag'); });
    cc.addEventListener('dragend', () => cc.classList.remove('drag'));
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const c = DB.customers.find(x => x.id === e.dataTransfer.getData('id'));
      if (!c || c.stage === col.dataset.stage) return;
      c.stage = col.dataset.stage;
      c.notes.push({ id:uid(), at:Date.now(), by:ME.id, text:`مرحله به «${stage(c.stage).name}» تغییر کرد.` });
      save(); render();
    });
  });
}

/* ----------------------------- drawer ------------------------------ */
function drawer(title, body, foot){
  $('#dTitle').textContent = title; $('#dBody').innerHTML = body; $('#dFoot').innerHTML = foot || '';
  $('#drawer').classList.add('on'); $('#scrim').classList.add('on');
}
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#dClose').addEventListener('click', closeDrawer);
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

function openCustomer(id){
  const c = DB.customers.find(x => x.id === id); if (!c) return;
  drawer(c.name, `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">${stageTag(c.stage)}
      <span class="tag" style="background:#EEF2F7;color:var(--body)">${c.industry}</span>
      <span class="tag" style="background:#EEF2F7;color:var(--body)">${c.city}</span></div>
    <div class="card pad" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:var(--muted);font-size:12px">ارزش تخمینی</span><b>${money(c.value)}</b></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:var(--muted);font-size:12px">مسئول پیگیری</span><b>${member(c.owner).name}</b></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--muted);font-size:12px">شماره تماس</span><b dir="ltr">${c.phone}</b></div>
    </div>
    <div class="f"><label>نیاز مشتری</label><div style="font-size:13px">${c.need || '—'}</div></div>
    <div class="sec-t" style="margin-top:20px">یادداشت‌ها و پیگیری‌ها <span>${FA(c.notes.length)} مورد</span></div>
    <div id="notes">${c.notes.slice().reverse().map(n => `<div class="note"><span>${member(n.by).name} · ${DATE(n.at)}</span>${n.text}</div>`).join('') || '<div class="empty">هنوز یادداشتی ثبت نشده</div>'}</div>
    <div class="f" style="margin-top:14px"><label>یادداشت جدید</label><textarea id="newNote" placeholder="نتیجهٔ تماس، قیمت پیشنهادی، زمان پیگیری بعدی…"></textarea></div>
    <button class="btn" id="saveNote">ثبت یادداشت</button>
  `, `<button class="btn p" id="edit" style="flex:1">ویرایش مشتری</button>
      <button class="btn" id="toDeal">ثبت فروش</button>`);
  $('#saveNote').addEventListener('click', () => {
    const t = $('#newNote').value.trim(); if (!t) return;
    c.notes.push({ id:uid(), at:Date.now(), by:ME.id, text:t }); save(); openCustomer(id);
  });
  $('#edit').addEventListener('click', () => editCustomer(c));
  $('#toDeal').addEventListener('click', () => editDeal(null, c.id));
}

function editCustomer(c){
  const isNew = !c;
  drawer(isNew ? 'مشتری جدید' : 'ویرایش مشتری', `
    <div class="f"><label>نام شرکت</label><input id="e_name" value="${c?c.name:''}" placeholder="مثلاً شوینده‌سازی پاک‌بان"></div>
    <div class="two">
      <div class="f"><label>شهر</label><input id="e_city" value="${c?c.city:''}"></div>
      <div class="f"><label>شماره تماس</label><input id="e_phone" dir="ltr" value="${c?c.phone:''}"></div>
    </div>
    <div class="two">
      <div class="f"><label>صنعت</label><select id="e_ind">${INDUSTRIES.map(i => `<option ${c&&c.industry===i?'selected':''}>${i}</option>`).join('')}</select></div>
      <div class="f"><label>مرحله</label><select id="e_stage">${STAGES.map(s => `<option value="${s.id}" ${c&&c.stage===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div>
    </div>
    <div class="two">
      <div class="f"><label>مسئول پیگیری</label><select id="e_owner">${TEAM.map(t => `<option value="${t.id}" ${(c?c.owner:ME.id)===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div>
      <div class="f"><label>ارزش تخمینی (میلیون تومان)</label><input id="e_val" type="number" value="${c?Math.round(c.value/1e6):''}"></div>
    </div>
    <div class="f"><label>نیاز مشتری</label><textarea id="e_need" placeholder="نوع درپوش، اندازه، تیراژ، رنگ…">${c?c.need:''}</textarea></div>
  `, `<button class="btn p" id="save" style="flex:1">${isNew ? 'افزودن مشتری' : 'ذخیره'}</button>
      ${isNew ? '' : '<button class="btn d" id="del">حذف</button>'}`);
  $('#save').addEventListener('click', () => {
    const name = $('#e_name').value.trim(); if (!name) { $('#e_name').focus(); return; }
    const data = { name, city:$('#e_city').value.trim(), phone:$('#e_phone').value.trim(), industry:$('#e_ind').value,
      stage:$('#e_stage').value, owner:$('#e_owner').value, value:(+$('#e_val').value || 0) * 1e6, need:$('#e_need').value.trim() };
    if (isNew) DB.customers.unshift({ id:uid(), created:Date.now(), notes:[{ id:uid(), at:Date.now(), by:ME.id, text:'مشتری ثبت شد.' }], ...data });
    else Object.assign(c, data);
    save(); closeDrawer(); render();
  });
  if (!isNew) $('#del').addEventListener('click', () => {
    if (!confirm('این مشتری حذف شود؟')) return;
    DB.customers = DB.customers.filter(x => x.id !== c.id); save(); closeDrawer(); render();
  });
}

/* ========================= SALES & COMMISSION ======================== */
function viewSales(){
  const rows = DB.deals.slice().sort((a,b) => b.at - a.at);
  const total = rows.reduce((a,d) => a + d.amount, 0);
  const comm = rows.reduce((a,d) => a + d.amount * d.rate / 100, 0);
  const unpaid = rows.filter(d => !d.paid).reduce((a,d) => a + d.amount * d.rate / 100, 0);
  const perMember = TEAM.map(t => ({
    t, sales: rows.filter(d => d.owner === t.id).reduce((a,d) => a + d.amount, 0),
    comm: rows.filter(d => d.owner === t.id).reduce((a,d) => a + d.amount * d.rate / 100, 0)
  })).filter(x => x.sales > 0).sort((a,b) => b.sales - a.sales);

  return head('فروش و پورسانت', 'هر فروش ثبت‌شده، پورسانت مسئولش را خودکار حساب می‌کند',
      '<button class="btn p" id="addD">+ ثبت فروش</button>') +
  `<div class="grid k3" style="margin-bottom:18px">
    <div class="card kpi"><div class="l">مجموع فروش ثبت‌شده</div><div class="v">${RIAL(total/1e6)}<small>م.ت</small></div></div>
    <div class="card kpi"><div class="l">مجموع پورسانت</div><div class="v">${RIAL(comm/1e6)}<small>م.ت</small></div></div>
    <div class="card kpi"><div class="l">پورسانت پرداخت‌نشده</div><div class="v" style="color:var(--orange)">${RIAL(unpaid/1e6)}<small>م.ت</small></div></div>
  </div>
  <div class="grid k2" style="margin-bottom:18px">
    <div class="card pad"><div class="sec-t">پورسانت هر نفر</div>${barChart(perMember.map(x => ({ label:x.t.name, value:x.comm/1e6, colour:x.t.colour })))}</div>
    <div class="card pad"><div class="sec-t">سهم هر نفر از فروش</div>${donut(perMember.map(x => ({ label:x.t.name, value:x.sales, colour:x.t.colour })))}</div>
  </div>
  <div class="card"><table>
    <thead><tr><th>مشتری</th><th>مسئول</th><th>مبلغ فروش</th><th>درصد</th><th>پورسانت</th><th>تاریخ</th><th>وضعیت</th></tr></thead>
    <tbody>${rows.map(d => {
      const c = DB.customers.find(x => x.id === d.customer);
      return `<tr data-id="${d.id}">
        <td><b>${c ? c.name : '—'}</b></td>
        <td><div class="who">${avatar(d.owner)}<b>${member(d.owner).name}</b></div></td>
        <td>${money(d.amount)}</td><td class="num">${FA(d.rate)}٪</td><td>${money(d.amount * d.rate / 100)}</td>
        <td style="color:var(--muted)">${DATE(d.at)}</td>
        <td>${d.paid ? '<span class="tag" style="background:rgba(18,161,80,.12);color:var(--green)">پرداخت شد</span>'
                     : '<span class="tag" style="background:rgba(217,145,0,.12);color:#8A5B00">در انتظار</span>'}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="7" class="empty">هنوز فروشی ثبت نشده</td></tr>'}</tbody>
  </table></div>`;
}

function wireSales(){
  $('#addD').addEventListener('click', () => editDeal(null));
  document.querySelectorAll('tbody tr[data-id]').forEach(tr =>
    tr.addEventListener('click', () => editDeal(DB.deals.find(d => d.id === tr.dataset.id))));
}

function editDeal(d, customerId){
  const isNew = !d;
  drawer(isNew ? 'ثبت فروش' : 'ویرایش فروش', `
    <div class="f"><label>مشتری</label><select id="d_c">${DB.customers.map(c =>
      `<option value="${c.id}" ${ (d ? d.customer : customerId) === c.id ? 'selected' : '' }>${c.name}</option>`).join('')}</select></div>
    <div class="two">
      <div class="f"><label>مسئول فروش</label><select id="d_o">${TEAM.map(t =>
        `<option value="${t.id}" ${(d?d.owner:ME.id)===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div>
      <div class="f"><label>مبلغ (میلیون تومان)</label><input id="d_a" type="number" value="${d?Math.round(d.amount/1e6):''}"></div>
    </div>
    <div class="two">
      <div class="f"><label>درصد پورسانت</label><input id="d_r" type="number" step="0.5" value="${d?d.rate:member(ME.id).rate||3}"></div>
      <div class="f"><label>وضعیت پرداخت</label><select id="d_p"><option value="0" ${d&&d.paid?'':'selected'}>در انتظار</option><option value="1" ${d&&d.paid?'selected':''}>پرداخت شد</option></select></div>
    </div>
    <div class="note" id="calc"></div>
  `, `<button class="btn p" id="dSave" style="flex:1">${isNew ? 'ثبت' : 'ذخیره'}</button>
      ${isNew ? '' : '<button class="btn d" id="dDel">حذف</button>'}`);
  const calc = () => { const a = (+$('#d_a').value||0)*1e6, r = +$('#d_r').value||0;
    $('#calc').innerHTML = `<span>پورسانت محاسبه‌شده</span><b>${RIAL(a*r/100/1e6)} میلیون تومان</b>`; };
  ['#d_a','#d_r'].forEach(s => $(s).addEventListener('input', calc)); calc();
  $('#dSave').addEventListener('click', () => {
    const data = { customer:$('#d_c').value, owner:$('#d_o').value, amount:(+$('#d_a').value||0)*1e6,
      rate:+$('#d_r').value||0, paid:$('#d_p').value === '1' };
    if (isNew) DB.deals.unshift({ id:uid(), at:Date.now(), ...data }); else Object.assign(d, data);
    const c = DB.customers.find(x => x.id === data.customer);
    if (c && c.stage !== 'won') { c.stage = 'won'; c.notes.push({ id:uid(), at:Date.now(), by:ME.id, text:'قرارداد بسته شد و فروش ثبت شد.' }); }
    save(); closeDrawer(); page = 'sales'; render();
  });
  if (!isNew) $('#dDel').addEventListener('click', () => {
    if (!confirm('این فروش حذف شود؟')) return;
    DB.deals = DB.deals.filter(x => x.id !== d.id); save(); closeDrawer(); render();
  });
}

/* ============================= DASHBOARD ============================ */
function viewDash(){
  const now = Date.now(), month = 30*86400000;
  const inMonth = DB.deals.filter(d => now - d.at < month);
  const prev = DB.deals.filter(d => now - d.at >= month && now - d.at < 2*month);
  const sum = a => a.reduce((x,d) => x + d.amount, 0);
  const growth = prev.length ? Math.round((sum(inMonth) - sum(prev)) / sum(prev) * 100) : 100;
  const open = DB.customers.filter(c => c.stage !== 'won');
  const pipeline = open.reduce((a,c) => a + c.value, 0);
  const wonCount = DB.customers.filter(c => c.stage === 'won').length;
  const rate = Math.round(wonCount / Math.max(1, DB.customers.length) * 100);

  const months = [...Array(6)].map((_,i) => {
    const end = now - (5-i)*month, start = end - month;
    return { label:new Intl.DateTimeFormat('fa-IR',{month:'long'}).format(new Date(end)),
             value: sum(DB.deals.filter(d => d.at > start && d.at <= end)) / 1e6 };
  });

  return head('داشبورد', `سلام ${ME.name.split(' ')[0]} — نمای کلی این ماه`, '<span class="demo">دادهٔ نمونه</span>') +
  `<div class="grid k4" style="margin-bottom:18px">
    <div class="card kpi"><div class="l">فروش ۳۰ روز اخیر</div><div class="v">${RIAL(sum(inMonth)/1e6)}<small>م.ت</small></div>
      <div class="t ${growth>=0?'up':'down'}">${growth>=0?'▲':'▼'} ${FA(Math.abs(growth))}٪ نسبت به ماه قبل</div></div>
    <div class="card kpi"><div class="l">ارزش پرونده‌های باز</div><div class="v">${RIAL(pipeline/1e6)}<small>م.ت</small></div>
      <div class="t up">${FA(open.length)} مشتری در جریان</div></div>
    <div class="card kpi"><div class="l">نرخ تبدیل به قرارداد</div><div class="v">${FA(rate)}<small>٪</small></div>
      <div class="t up">${FA(wonCount)} قرارداد بسته‌شده</div></div>
    <div class="card kpi"><div class="l">پورسانت این ماه</div><div class="v">${RIAL(inMonth.reduce((a,d)=>a+d.amount*d.rate/100,0)/1e6)}<small>م.ت</small></div>
      <div class="t up">${FA(inMonth.length)} فروش ثبت‌شده</div></div>
  </div>
  <div class="grid k2" style="margin-bottom:18px">
    <div class="card pad"><div class="sec-t">روند فروش <span>۶ ماه اخیر، میلیون تومان</span></div>${lineChart(months)}</div>
    <div class="card pad"><div class="sec-t">مشتریان در هر مرحله</div>${barChart(STAGES.map(s => ({
      label:s.name, value:DB.customers.filter(c => c.stage === s.id).length, colour:s.colour, int:true })))}</div>
  </div>
  <div class="grid k2">
    <div class="card"><div class="pad sec-t" style="margin:0">آخرین پیگیری‌ها</div>
      <table><tbody>${DB.customers.slice().sort((a,b) =>
        (b.notes[b.notes.length-1]?.at||0) - (a.notes[a.notes.length-1]?.at||0)).slice(0,5).map(c => {
        const n = c.notes[c.notes.length-1];
        return `<tr><td><div class="who">${avatar(c.owner)}<div><b>${c.name}</b><span>${n?n.text.slice(0,40):''}</span></div></div></td>
          <td style="text-align:end;color:var(--muted);white-space:nowrap">${n?DATE(n.at):''}</td></tr>`;
      }).join('')}</tbody></table></div>
    <div class="card"><div class="pad sec-t" style="margin:0">فروش هر عضو تیم</div>
      <table><tbody>${TEAM.map(t => ({ t, v:DB.deals.filter(d => d.owner === t.id).reduce((a,d) => a+d.amount,0) }))
        .filter(x => x.v > 0).sort((a,b) => b.v - a.v).map(x =>
        `<tr><td><div class="who">${avatar(x.t.id)}<div><b>${x.t.name}</b><span>${x.t.role}</span></div></div></td>
         <td style="text-align:end">${money(x.v)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

/* ------------------------------ charts ------------------------------ */
function lineChart(data){
  const W = 520, H = 200, P = 34, max = Math.max(1, ...data.map(d => d.value)) * 1.2;
  const x = i => P + i * (W - P*2) / Math.max(1, data.length - 1);
  const y = v => H - 26 - (v / max) * (H - 60);
  const pts = data.map((d,i) => [x(i), y(d.value)]);
  const path = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = path + ` L${x(data.length-1)} ${H-26} L${P} ${H-26} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7B02" stop-opacity=".28"/><stop offset="1" stop-color="#FF7B02" stop-opacity="0"/></linearGradient></defs>
    ${[0,.5,1].map(f => `<line x1="${P}" x2="${W-P}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#EDF1F7"/>`).join('')}
    <path d="${area}" fill="url(#g1)"/>
    <path d="${path}" fill="none" stroke="#FF7B02" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#fff" stroke="#FF7B02" stroke-width="2"/>
      <text x="${p[0]}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8B95A5">${data[i].label}</text>
      <text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F1B2D">${RIAL(data[i].value)}</text>`).join('')}
  </svg>`;
}

function barChart(data){
  const max = Math.max(1, ...data.map(d => d.value));
  return `<div style="display:flex;flex-direction:column;gap:11px;margin-top:6px">${data.map(d => `
    <div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
        <span>${d.label}</span><b class="num">${d.int ? FA(d.value) : RIAL(d.value)}</b></div>
      <div style="height:9px;border-radius:6px;background:#EDF1F7;overflow:hidden">
        <div style="height:100%;width:${(d.value/max*100).toFixed(1)}%;background:${d.colour};border-radius:6px"></div></div>
    </div>`).join('')}</div>`;
}

function donut(data){
  const total = data.reduce((a,d) => a + d.value, 0) || 1, R = 54, C = 2 * Math.PI * R;
  let off = 0;
  const rings = data.map(d => {
    const len = d.value / total * C, s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${d.colour}" stroke-width="18"
      stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 70 70)"/>`;
    off += len; return s;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <svg viewBox="0 0 140 140" style="width:140px;height:140px">${rings}
      <text x="70" y="66" text-anchor="middle" font-size="11" fill="#8B95A5">مجموع</text>
      <text x="70" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="#0F1B2D">${RIAL(total/1e6)}</text></svg>
    <div class="lg" style="flex-direction:column;gap:7px">${data.map(d =>
      `<span><i style="background:${d.colour}"></i>${d.label} — ${FA(Math.round(d.value/total*100))}٪</span>`).join('')}</div>
  </div>`;
}

/* =============================== TEAM =============================== */
function viewTeam(){
  return head('تیم نیوکپ', `${FA(TEAM.length)} عضو`, '') +
  `<div class="grid k3">${TEAM.map(t => {
    const sales = DB.deals.filter(d => d.owner === t.id).reduce((a,d) => a + d.amount, 0);
    const comm = DB.deals.filter(d => d.owner === t.id).reduce((a,d) => a + d.amount * d.rate / 100, 0);
    const mine = DB.customers.filter(c => c.owner === t.id).length;
    return `<div class="card"><div class="tm">
        <span class="av" style="background:${t.colour}">${t.name.slice(0,1)}</span>
        <div><b>${t.name}</b><span>${t.role}</span></div>
      </div>
      <table><tbody>
        <tr><td style="color:var(--muted)">مشتریان</td><td style="text-align:end"><b>${FA(mine)}</b></td></tr>
        <tr><td style="color:var(--muted)">فروش ثبت‌شده</td><td style="text-align:end">${money(sales)}</td></tr>
        <tr><td style="color:var(--muted)">پورسانت</td><td style="text-align:end">${money(comm)}</td></tr>
        <tr><td style="color:var(--muted)">نام کاربری</td><td style="text-align:end" dir="ltr">${t.user}</td></tr>
      </tbody></table></div>`;
  }).join('')}</div>
  <div class="card pad" style="margin-top:18px;color:var(--body);font-size:12.5px">
    نام کامل خانم رمضانی، مدیر مالی و مسئول فنی هنوز وارد نشده. با اسم‌های کامل و عکس پرسنلی، این صفحه کامل می‌شود.
  </div>`;
}

/* =============================== CHAT =============================== */
function viewChat(){
  return head('گفتگوی تیمی', 'یک کانال مشترک برای کل تیم', '') +
  `<div class="card chat">
    <div class="msgs" id="msgs">${DB.messages.map(m => `
      <div class="msg ${m.by === ME.id ? 'mine' : ''}">${avatar(m.by)}
        <div class="bub"><b>${member(m.by).name}</b>${m.text}
          <time>${new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date(m.at))}</time></div>
      </div>`).join('')}</div>
    <div class="send"><input id="msg" placeholder="پیام برای تیم…"><button class="btn p" id="sendBtn">ارسال</button></div>
  </div>`;
}
function wireChat(){
  const box = $('#msgs'); box.scrollTop = box.scrollHeight;
  const send = () => {
    const t = $('#msg').value.trim(); if (!t) return;
    DB.messages.push({ id:uid(), by:ME.id, at:Date.now(), text:t }); save(); render();
  };
  $('#sendBtn').addEventListener('click', send);
  $('#msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
}

/* ------------------------------- boot ------------------------------- */
if (ME) start();
</script>
